<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href=".\css\style.css">
    <link rel="stylesheet" href=".\css\responsive.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css" integrity="sha512-5Hs3dF2AEPkpNAR7UiOHba+lRSJNeM2ECkwxUIxC1Q/FLycGTbNapWXB4tP889k5T5Ju8fs4b1P5z/iB4nMfSQ==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <script src="monscript.js" defer type="module"></script>
    <title>Mon site de cinéma</title>
</head>
<body>
    <header>
        <i class="fa-solid fa-film"></i>
        <div id="conteneurHeader">
            <h2><a href="#rediriger_films">Films</a></h2>
            <h2><a href="#rediriger_series">Séries</a></h2>
            <h2><a href="#rediriger_tendances">Populaires</a></h2>
        </div>
    </header>
    <main>
        <section id="accueilRecherche">
            <div id="barreRecherche">
                <input type="text" id="recherche" placeholder="Rechercher un film"/>
                <i class="fa-brands fa-sistrix"></i>
            </div>
        </section>
        
        <section id="tendances">
            <div class="conteneurMenuSection">
                <h1 id="rediriger_tendances">Tendances</h1>
                <button id="aujourdhui">
                    Aujourd'hui
                </button>
                <button id="semaine">
                    Cette semaine
                </button>
            </div>
            <div id="listeTendances">

            </div>
        </section>
        <section id="series">
            <div class="conteneurMenuSection">
                <h1 id="rediriger_series">Séries TV</h1>
                <button id="meilleuresSeries" class="meilleures">
                    Mieux notées
                </button>
                <button id="populairesSeries" class="populaires">
                    Populaires
                </button>
            </div>
            <div id="listeSeries">

            </div>
        </section>
        <section id="films">
            <div class="conteneurMenuSection">
                <h1 id="rediriger_films">Films</h1>
                <button id="meilleursFilms" class="meilleures">
                    Mieux notés
                </button>
                <button id="populairesFilms" class="populaires">
                    Populaires
                </button>
            </div>
            <div id="listeFilms">

            </div>
        </section>
    </main>
    <footer>
      
    </footer>
</body>
</html>
